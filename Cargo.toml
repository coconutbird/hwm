[package]
name = "halo-wars-manager"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hwm"
path = "src/main.rs"

[dependencies]
# ensemble-formats crates (git deps; matches how ensemble-assets consumes them)
era = { git = "https://github.com/coconutbird/ensemble-formats.git", branch = "dev/prim" }
xmb = { git = "https://github.com/coconutbird/ensemble-formats.git", branch = "dev/prim" }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Config
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
winreg = "0.55.0"
quick-xml = { version = "0.39.0", features = ["serialize"] }
sha2 = "0.10"
